<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main>
      <article class="card">
        <div class="nft-image-wrapper">
          <img
            class="nft-img"
            src="./images/image-equilibrium.jpg"
            alt="Translucent glasslike cube hovering above a reflective surface with colorful internal refractions in a deep blue minimal background, serene futuristic mood"
          />
          <img class="view-img" src="./images/icon-view.svg" alt="" />
        </div>
        <section class="card-text-section">
          <div class="main-text">
            <h1>Equilibrium #3429</h1>
            <p class="description">
              Our Equilibrium collection promotes balance and calm.
            </p>
            <div class="price-container">
              <div class="price">
                <img src="./images/icon-ethereum.svg" alt="" />
                <p class="value">0.041 ETH</p>
              </div>
              <div class="time-left-container">
                <img src="./images/icon-clock.svg" alt="" />
                <p class="time">3 days left</p>
              </div>
            </div>
          </div>
          <hr />
          <div class="profile-container">
            <img
              class="avatar-img"
              src="./images/image-avatar.png"
              alt="Portrait of a person with shoulder-length dark hair and warm, serene expression against a dark blurred background, creating an intimate and contemplative atmosphere"
            />
            <p class="author">Creation of <span>Jules Wyvern</span></p>
          </div>
        </section>
      </article>
    </main>
  </body>
</html>
